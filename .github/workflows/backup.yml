name: Respaldo diario

# Respaldo de la base con pg_dump, cifrado con GPG y guardado 14 días como
# artefacto del run. Se activa al definir los secretos BACKUP_DATABASE_URL y
# BACKUP_PASSPHRASE en GitHub (ver docs/respaldos.md). Sin ellos, no hace nada.
on:
  schedule:
    - cron: "0 8 * * *" # 03:00 en Panamá
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: pg_dump cifrado
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Sin configurar
        if: env.BACKUP_DATABASE_URL == '' || env.BACKUP_PASSPHRASE == ''
        run: echo "::notice::Respaldo desactivado. Define BACKUP_DATABASE_URL y BACKUP_PASSPHRASE (docs/respaldos.md)."

      - uses: actions/checkout@v4
        if: env.BACKUP_DATABASE_URL != '' && env.BACKUP_PASSPHRASE != ''

      - name: Cliente de PostgreSQL 17
        if: env.BACKUP_DATABASE_URL != '' && env.BACKUP_PASSPHRASE != ''
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Respaldo
        if: env.BACKUP_DATABASE_URL != '' && env.BACKUP_PASSPHRASE != ''
        run: node scripts/backup.mjs
        env:
          BACKUP_DIR: backups
          BACKUP_SCHEMAS: ${{ vars.BACKUP_SCHEMAS }}
          PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump

      - name: Cifrado
        if: env.BACKUP_DATABASE_URL != '' && env.BACKUP_PASSPHRASE != ''
        run: |
          for f in backups/*.dump; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 -o "$f.gpg" "$f"
            rm "$f"
          done

      - uses: actions/upload-artifact@v4
        if: env.BACKUP_DATABASE_URL != '' && env.BACKUP_PASSPHRASE != ''
        with:
          name: respaldo-${{ github.run_id }}
          path: backups/*.gpg
          retention-days: 14
          if-no-files-found: error
